name: Update GitHub README Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=PKHarsimran&show_icons=true&theme=radical&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=PKHarsimran&layout=compact&theme=radical&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Website Downloader card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=PKHarsimran&repo=website-downloader&theme=radical
          path: profile/website-downloader.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SwiftIOC card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=PKHarsimran&repo=SwiftIOC-Automated-Threat-Intelligence-Collector&theme=radical
          path: profile/swiftioc.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "Update GitHub README stats" || exit 0
          git push
