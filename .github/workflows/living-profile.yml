name: Build living profile exhibits

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/living-profile.yml"
      - "scripts/living_profile.py"
      - "scripts/profile_motion.py"
      - "scripts/profile_demos.py"
      - "scripts/demo_terminal.py"
      - "scripts/test_demo_terminal.py"
      - "scripts/test_living_profile.py"
      - "scripts/profile_theme.py"
      - "fonts/**"
      - "demos/**"
      - "profile/lab-services.json"

permissions:
  contents: read

concurrency:
  group: living-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out profile source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify data boundaries and fixture checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Read public diagnostics and resolve released demo sources
        id: exhibits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/living_profile.py

      - name: Prepare isolated environments and harmless fixtures
        if: steps.exhibits.outputs.needs_demos == 'true'
        run: python3 scripts/profile_demos.py prepare

      - name: Verify both released CLIs before recording
        if: steps.exhibits.outputs.needs_demos == 'true'
        run: |
          python3 scripts/profile_demos.py inspector
          python3 scripts/profile_demos.py downloader

      - name: Install the bundled terminal font
        if: steps.exhibits.outputs.needs_demos == 'true'
        run: |
          install -D fonts/ibm-plex-mono-500.ttf "$HOME/.local/share/fonts/ProfileMono.ttf"
          fc-cache -f
          test "$(fc-match -f '%{family}' ProfileMono)" = "ProfileMono"

      - name: Record the actual IOC Inspector execution
        if: steps.exhibits.outputs.needs_demos == 'true'
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2
        with:
          version: v0.12.1
          path: demos/inspector.tape

      - name: Record the mobile IOC Inspector execution
        if: steps.exhibits.outputs.needs_demos == 'true'
        run: vhs demos/inspector-mobile.tape

      - name: Record the actual Website Downloader execution
        if: steps.exhibits.outputs.needs_demos == 'true'
        run: |
          vhs demos/downloader.tape
          vhs demos/downloader-mobile.tape

      - name: Verify recordings and build case findings and static posters
        if: steps.exhibits.outputs.needs_demos == 'true'
        run: .demo-work/inspector-env/bin/python scripts/profile_demos.py finish

      - name: Preserve failed recorder frame for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recorder-diagnostic
          retention-days: 1
          if-no-files-found: ignore
          path: profile/*-capture.png

      - name: Upload verified exhibits
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: living-profile-exhibits
          retention-days: 7
          if-no-files-found: error
          path: |
            profile/intel-conveyor*
            profile/homelab-flow*
            profile/release-patches*
            profile/case-*
            profile/inspector-demo*
            profile/downloader-demo*
            profile/demo-provenance.json

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - name: Check out current profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download verified exhibits
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: living-profile-exhibits
          path: generated

      - name: Commit only generated exhibit files
        run: |
          cp -R generated/. profile/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/intel-conveyor* profile/homelab-flow* profile/release-patches* profile/case-* profile/inspector-demo* profile/downloader-demo* profile/demo-provenance.json
          if git diff --cached --quiet; then
            echo "Living profile exhibits are unchanged."
            exit 0
          fi
          git commit -m "Refresh intelligence conveyor, case file, lab flow, patches and demos"
          git pull --rebase origin main
          git push origin HEAD:main
