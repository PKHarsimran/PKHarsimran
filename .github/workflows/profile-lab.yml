name: Refresh public profile lab

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-lab.yml"
      - "scripts/generate_profile_lab.py"
      - "scripts/contribution_arcade.py"
      - "scripts/profile_arcade_scene.py"
      - "scripts/profile_arcade_lab.py"
      - "scripts/profile_drawers.py"
      - "scripts/test_profile_arcade_lab.py"
      - "scripts/test_generate_profile_lab.py"
      - "scripts/profile_theme.py"
      - "scripts/profile_cinematics.py"
      - "scripts/profile_thread.py"
      - "scripts/profile_studio.py"
      - "scripts/profile_motion.py"
      - "scripts/build_readme_art.py"
      - "scripts/build_profile_design.py"
      - "scripts/build_bender_collectible.py"
      - "scripts/build_profile_style.py"
      - "scripts/profile_art.py"
      - "fonts/**"

permissions:
  contents: write

concurrency:
  group: profile-lab
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check public-data boundaries and failure handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Check reproducible README illustrations
        run: |
          python3 scripts/build_readme_art.py --check
          python3 scripts/build_profile_design.py --check
          python3 scripts/build_bender_collectible.py --check

      - name: Generate public radar and contribution arcade
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile_lab.py --readme README.md

      - name: Commit generated artwork and source snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md profile/public-pulse.svg profile/public-pulse-mobile.svg profile/public-pulse.json profile/public-pulse.md profile/contribution-evidence-run.svg profile/contribution-evidence-run-mobile.svg profile/contribution-calendar.json profile/arcade-lab.json
          git add -A -- profile/arcade
          if git diff --cached --quiet; then
            echo "Public profile artifacts are unchanged."
            exit 0
          fi
          git commit -m "Refresh public build radar and contribution arcade"
          git pull --rebase origin main
          git push origin HEAD:main
