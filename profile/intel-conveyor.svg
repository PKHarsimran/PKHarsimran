<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">SwiftIOC intelligence conveyor</title><desc id="desc">Animated illustration of the collection pipeline. All counts come from the published diagnostics. Retained snapshot and one collection interval; not threats detected or local incidents.</desc>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152133"/><stop offset="1" stop-color="#0D1117"/></linearGradient></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="388" rx="22" fill="url(#surface)" stroke="#29364B"/>
<style>.packet{animation:packet 8s linear infinite}.scan{animation:scan 4s ease-in-out infinite}@keyframes packet{to{stroke-dashoffset:-96}}@keyframes scan{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.packet,.scan{animation:none}}</style>
<text x="28" y="34" fill="#43E6C5" font-size="14" font-weight="600" >SWIFTIOC / INTELLIGENCE CONVEYOR</text>
<text x="28" y="74" fill="#EFF4FC" font-size="26" font-weight="600" >Follow the data. Keep the evidence.</text>
<path class="packet" d="M248 171H270" stroke="#43E6C5" stroke-width="3" stroke-dasharray="4 5"/>
<rect x="28" y="108" width="220" height="126" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="44" y="133" fill="#43E6C5" font-size="13" font-weight="600" >01 / COLLECT</text>
<text x="44" y="161" fill="#EFF4FC" font-size="19" font-weight="600" >Public feeds</text>
<text x="44" y="199" fill="#A7B6CE" font-size="13" font-weight="400" >Retrieve source records</text>
<path class="packet" d="M490 171H512" stroke="#A995FF" stroke-width="3" stroke-dasharray="4 5"/>
<rect x="270" y="108" width="220" height="126" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="286" y="133" fill="#A995FF" font-size="13" font-weight="600" >02 / NORMALIZE</text>
<text x="286" y="161" fill="#EFF4FC" font-size="19" font-weight="600" >5,653 duplicates</text>
<text x="286" y="199" fill="#A7B6CE" font-size="13" font-weight="400" >Removed during collection</text>
<path class="packet" d="M732 171H754" stroke="#F36BAA" stroke-width="3" stroke-dasharray="4 5"/>
<rect x="512" y="108" width="220" height="126" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="528" y="133" fill="#F36BAA" font-size="13" font-weight="600" >03 / PUBLISH</text>
<text x="528" y="161" fill="#EFF4FC" font-size="19" font-weight="600" >10,000 retained</text>
<text x="528" y="199" fill="#A7B6CE" font-size="13" font-weight="400" >Bounded snapshot</text>
<rect x="754" y="108" width="220" height="126" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="770" y="133" fill="#69B9FF" font-size="13" font-weight="600" >04 / INVESTIGATE</text>
<text x="770" y="161" fill="#EFF4FC" font-size="19" font-weight="600" >Source-aware records</text>
<text x="770" y="199" fill="#A7B6CE" font-size="13" font-weight="400" >Open the analyst dashboard</text>
<text x="28" y="272" fill="#43E6C5" font-size="20" font-weight="600" >6,878 observables  /  3,122 CVEs</text>
<text x="28" y="302" fill="#A7B6CE" font-size="15" font-weight="400" >Last interval: +278 added / 262 updated / 278 removed</text>
<text x="28" y="334" fill="#A7B6CE" font-size="12" font-weight="400" >COLLECTION / 17 Oct 2026 / 18:06 UTC</text>
<text x="28" y="368" fill="#A7B6CE" font-size="12" font-weight="400" >Retained records, not local detections. Open the snapshot for context.</text>
</g></svg>
