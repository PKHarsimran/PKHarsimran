<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="426" viewBox="0 0 1000 426" role="img" aria-labelledby="title desc"><title id="title">Zima homelab flow theatre</title><desc id="desc">Illustrative service handoffs, generated from the curated public service manifest. No live health or network topology is represented.</desc>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152133"/><stop offset="1" stop-color="#0D1117"/></linearGradient></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="424" rx="22" fill="url(#surface)" stroke="#29364B"/>
<style>.packet{animation:packet 8s linear infinite}.scan{animation:scan 4s ease-in-out infinite}@keyframes packet{to{stroke-dashoffset:-96}}@keyframes scan{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.packet,.scan{animation:none}}</style>
<text x="28" y="34" fill="#43E6C5" font-size="14" font-weight="600" >ZIMA HOMELAB / FLOW THEATRE</text>
<text x="28" y="76" fill="#EFF4FC" font-size="26" font-weight="600" >From “can we watch this?” to play.</text>
<path class="packet" d="M248 185H270" stroke="#43E6C5" stroke-width="3" stroke-dasharray="5 7"/>
<rect x="28" y="108" width="220" height="154" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="44" y="135" fill="#43E6C5" font-size="15" font-weight="600" >01 / REQUEST</text>
<text x="44" y="168" fill="#EFF4FC" font-size="18" font-weight="600" >Jellyseerr</text>
<text x="44" y="238" fill="#A7B6CE" font-size="13" font-weight="400" >Choose the next watch</text>
<path class="packet" d="M490 185H512" stroke="#A995FF" stroke-width="3" stroke-dasharray="5 7"/>
<rect x="270" y="108" width="220" height="154" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="286" y="135" fill="#A995FF" font-size="15" font-weight="600" >02 / AUTOMATE</text>
<text x="286" y="168" fill="#EFF4FC" font-size="18" font-weight="600" >Radarr · Sonarr</text>
<text x="286" y="194" fill="#EFF4FC" font-size="18" font-weight="600" >Prowlarr · Bazarr</text>
<text x="286" y="238" fill="#A7B6CE" font-size="13" font-weight="400" >Coordinate the library</text>
<path class="packet" d="M732 185H754" stroke="#F36BAA" stroke-width="3" stroke-dasharray="5 7"/>
<rect x="512" y="108" width="220" height="154" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="528" y="135" fill="#F36BAA" font-size="15" font-weight="600" >03 / DOWNLOAD</text>
<text x="528" y="168" fill="#EFF4FC" font-size="18" font-weight="600" >Transmission · Gluetun</text>
<text x="528" y="238" fill="#A7B6CE" font-size="13" font-weight="400" >VPN-routed transfers</text>
<rect x="754" y="108" width="220" height="154" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="770" y="135" fill="#69B9FF" font-size="15" font-weight="600" >04 / WATCH</text>
<text x="770" y="168" fill="#EFF4FC" font-size="18" font-weight="600" >Jellyfin</text>
<text x="770" y="238" fill="#A7B6CE" font-size="13" font-weight="400" >Bring the library home</text>
<text x="28" y="305" fill="#43E6C5" font-size="13" font-weight="600" >LIBRARIES</text>
<text x="154" y="305" fill="#A7B6CE" font-size="16" font-weight="400" >PhotoPrism · Shelfmark · Audiobookshelf</text>
<text x="28" y="336" fill="#A995FF" font-size="13" font-weight="600" >OPERATIONS</text>
<text x="154" y="336" fill="#A7B6CE" font-size="16" font-weight="400" >Homepage · Portainer · Custom flow dashboards</text>
<text x="28" y="367" fill="#F36BAA" font-size="13" font-weight="600" >MONITORING</text>
<text x="154" y="367" fill="#A7B6CE" font-size="16" font-weight="400" >Uptime Kuma · Glances · Dozzle · ntfy</text>
<text x="28" y="404" fill="#A7B6CE" font-size="12" font-weight="400" >Illustrated handoffs / Curated service list / No live telemetry</text>
</g></svg>
