<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="32" viewBox="0 8 1000 32" role="img" aria-label="Orbital constellation divider" data-motion-role="divider"><style id="orbital-art-style">.art-twinkle{animation:art-twinkle 9s ease-in-out infinite}.art-orbit{animation:art-orbit 36s linear infinite}.visitor-float{animation:visitor-float 5s ease-in-out infinite}.visitor-wave{transform-box:fill-box;transform-origin:bottom left;animation:visitor-wave 8s ease-in-out infinite}@keyframes art-twinkle{0%,100%{opacity:.25}50%{opacity:.8}}@keyframes art-orbit{to{transform:rotate(360deg)}}@keyframes visitor-float{50%{transform:translateY(-4px)}}@keyframes visitor-wave{0%,65%,100%{transform:rotate(0)}70%,80%{transform:rotate(-18deg)}75%,85%{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){.art-twinkle,.art-orbit,.visitor-float,.visitor-wave{animation:none}}</style><defs><linearGradient id="ink"><stop stop-color="#43E6C5" stop-opacity="0" /><stop offset=".3" stop-color="#43E6C5" stop-opacity=".35" /><stop offset=".5" stop-color="#A995FF" /><stop offset=".7" stop-color="#F36BAA" stop-opacity=".35" /><stop offset="1" stop-color="#F36BAA" stop-opacity="0" /></linearGradient></defs><path d="M0 24C160 9 322 38 467 24M533 24C678 10 843 39 1000 24" fill="none" stroke="url(#ink)" /><path d="M0 29C189 39 335 6 465 26M535 26C682 40 820 5 1000 20" fill="none" stroke="url(#ink)" stroke-opacity=".35" /><g transform="translate(500 24)"><ellipse rx="28" ry="10" transform="rotate(-20)" fill="none" stroke="#A995FF" stroke-opacity=".6" /><g class="art-orbit"><circle cx="28" r="2" fill="#43E6C5" /></g><path transform="translate(0 0)" d="M0-7Q0 0 7 0Q0 0 0 7Q0 0-7 0Q0 0 0-7Z" fill="#F36BAA" /></g><g class="art-twinkle"><path transform="translate(277 24)" d="M0-3Q0 0 3 0Q0 0 0 3Q0 0-3 0Q0 0 0-3Z" fill="#43E6C5" /><path transform="translate(735 24)" d="M0-3Q0 0 3 0Q0 0 0 3Q0 0-3 0Q0 0 0-3Z" fill="#A995FF" /></g><style id="profile-motion-style">
.motion-echo{opacity:0;animation:echo 8s ease-out infinite;transform-origin:0 0}
.motion-frame{animation:frame-travel 28s linear infinite}
.motion-scan{opacity:0;animation:document-scan 7s ease-in-out infinite}
.motion-result{opacity:.2;animation:clue 7s ease-in-out infinite}
.motion-parcel{opacity:0;animation:parcel 7s linear infinite}
.motion-eyes{transform-box:fill-box;transform-origin:center;animation:eye-rest 7.4s linear infinite}
.motion-radio{opacity:0;animation:radio 8s ease-out infinite}
.motion-stage{opacity:.08;animation:handoff 12s ease-in-out infinite}
@keyframes echo{0%,15%{opacity:0;transform:scale(.72)}25%{opacity:.22}70%,100%{opacity:0;transform:scale(1.28)}}
@keyframes frame-travel{to{stroke-dashoffset:-1000}}
@keyframes document-scan{0%,12%{opacity:0;transform:translateY(-25px)}22%{opacity:.8}65%{opacity:.8;transform:translateY(24px)}78%,100%{opacity:0;transform:translateY(24px)}}
@keyframes clue{0%,30%,100%{opacity:.15}48%,68%{opacity:.9}}
@keyframes parcel{0%,8%,100%{opacity:0}18%,78%{opacity:.9}94%{opacity:0}}
@keyframes eye-rest{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
@keyframes radio{0%,60%,100%{opacity:0}68%{opacity:.65;transform:translateY(0)}85%{opacity:0;transform:translateY(-5px)}}
@keyframes handoff{0%,22%,100%{opacity:.08}7%,14%{opacity:.7}}
@media(prefers-reduced-motion:reduce){.motion-only{display:none!important}.motion-eyes{animation:none!important}}
</style><g id="profile-motion-overlay" aria-hidden="true"><g class="motion-only" data-motion="traveller" fill="#43E6C5" stroke="none"><path d="M-16 0H-3" stroke="#43E6C5" stroke-width="1.6" stroke-opacity=".35" stroke-linecap="round" /><circle r="2.4" fill="#43E6C5" /><animateMotion dur="18s" begin="0s" repeatCount="indefinite" rotate="auto" path="M35 24C160 9 322 38 467 24Q500 18 533 24C678 10 843 39 965 24" /></g></g></svg>
