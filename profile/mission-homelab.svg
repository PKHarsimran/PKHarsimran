<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Inside the homelab</title><desc id="desc">A conceptual map linking the homelab to collection with Fluentd and MQTT, storage with InfluxDB, dashboards with Grafana, and automation with Ansible and Semaphore. Raspberry Pi is used for experiments.</desc>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152133"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#43E6C5"/><stop offset=".52" stop-color="#A995FF"/><stop offset="1" stop-color="#F36BAA"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A7B6CE" stroke-opacity=".055"/></pattern></defs>
<style>.pulse{animation:pulse 3s ease-in-out infinite}.radar-motion{animation:radar 18s linear infinite}.bot-float{animation:float 4s ease-in-out infinite}.packet{animation:flow 5s linear infinite}@keyframes pulse{50%{opacity:.35}}@keyframes radar{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes flow{from{stroke-dashoffset:54}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.pulse,.radar-motion,.bot-float,.packet{animation:none}}</style>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="398" rx="22" fill="url(#surface)" stroke="#29364B"/>
