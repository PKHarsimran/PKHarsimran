<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" role="img" aria-labelledby="title desc">
<title id="title">Zima homelab — a connected Docker Compose home server</title>
<desc id="desc">Media and library automation with Jellyfin, Jellyseerr, Radarr, Sonarr, Prowlarr and Bazarr. Downloads with Transmission and Gluetun. Photos with PhotoPrism. Books with Shelfmark and Audiobookshelf. Operations with Homepage, Portainer and custom flow dashboards. Monitoring with Uptime Kuma, Glances, Dozzle and ntfy. This is a service overview, not a network diagram.</desc>
