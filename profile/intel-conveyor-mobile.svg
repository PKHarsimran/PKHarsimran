<svg xmlns="http://www.w3.org/2000/svg" width="600" height="686" viewBox="0 0 600 686" role="img" aria-labelledby="title desc"><title id="title">SwiftIOC intelligence conveyor</title><desc id="desc">Animated illustration of the collection pipeline. All counts come from the published diagnostics. Retained snapshot and one collection interval; not threats detected or local incidents.</desc>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152133"/><stop offset="1" stop-color="#0D1117"/></linearGradient></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="598" height="684" rx="22" fill="url(#surface)" stroke="#29364B"/>
<style>.packet{animation:packet 8s linear infinite}.scan{animation:scan 4s ease-in-out infinite}@keyframes packet{to{stroke-dashoffset:-96}}@keyframes scan{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.packet,.scan{animation:none}}</style>
<text x="28" y="34" fill="#43E6C5" font-size="14" font-weight="600" >SWIFTIOC / INTELLIGENCE CONVEYOR</text>
<text x="28" y="74" fill="#EFF4FC" font-size="26" font-weight="600" >Follow the data. Keep the evidence.</text>
<path class="packet" d="M300 186V202" stroke="#43E6C5" stroke-width="3" stroke-dasharray="4 5"/>
<rect x="28" y="98" width="544" height="88" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="44" y="123" fill="#43E6C5" font-size="13" font-weight="600" >01 / COLLECT</text>
<text x="44" y="151" fill="#EFF4FC" font-size="22" font-weight="600" >Public feeds</text>
<text x="44" y="174" fill="#A7B6CE" font-size="16" font-weight="400" >Retrieve source records</text>
<path class="packet" d="M300 290V306" stroke="#A995FF" stroke-width="3" stroke-dasharray="4 5"/>
<rect x="28" y="202" width="544" height="88" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="44" y="227" fill="#A995FF" font-size="13" font-weight="600" >02 / NORMALIZE</text>
<text x="44" y="255" fill="#EFF4FC" font-size="22" font-weight="600" >5,653 duplicates</text>
<text x="44" y="278" fill="#A7B6CE" font-size="16" font-weight="400" >Removed during collection</text>
<path class="packet" d="M300 394V410" stroke="#F36BAA" stroke-width="3" stroke-dasharray="4 5"/>
<rect x="28" y="306" width="544" height="88" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="44" y="331" fill="#F36BAA" font-size="13" font-weight="600" >03 / PUBLISH</text>
<text x="44" y="359" fill="#EFF4FC" font-size="22" font-weight="600" >10,000 retained</text>
<text x="44" y="382" fill="#A7B6CE" font-size="16" font-weight="400" >Bounded snapshot</text>
<rect x="28" y="410" width="544" height="88" rx="14" fill="#121A26" stroke="#29364B"/>
<text x="44" y="435" fill="#69B9FF" font-size="13" font-weight="600" >04 / INVESTIGATE</text>
<text x="44" y="463" fill="#EFF4FC" font-size="22" font-weight="600" >Source-aware records</text>
<text x="44" y="486" fill="#A7B6CE" font-size="16" font-weight="400" >Open the analyst dashboard</text>
<text x="28" y="538" fill="#43E6C5" font-size="21" font-weight="600" >6,878 observables  /  3,122 CVEs</text>
<text x="28" y="568" fill="#A7B6CE" font-size="17" font-weight="400" >Last interval: +278 added / 262 updated / 278 removed</text>
<text x="28" y="600" fill="#A7B6CE" font-size="14" font-weight="400" >COLLECTION / 17 Oct 2026 / 18:06 UTC</text>
<text x="28" y="664" fill="#A7B6CE" font-size="14" font-weight="400" >Retained records, not local detections. Open the snapshot for context.</text>
</g></svg>
