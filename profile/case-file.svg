<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc"><title id="title">IOC Inspector / 2026-W42</title><desc id="desc">Owned harmless training PDF. Static analysis; external reputation lookups disabled. The tool verdict is not a security guarantee.</desc>
