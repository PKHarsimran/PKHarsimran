<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Harsimran Sidhu — security, intelligence, automation</title><desc id="desc">A mint, violet, and pink mission-control banner with an animated radar and pixel robot. All animation is decorative.</desc>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152133"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#43E6C5"/><stop offset=".52" stop-color="#A995FF"/><stop offset="1" stop-color="#F36BAA"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A7B6CE" stroke-opacity=".055"/></pattern></defs>
<style>.pulse{animation:pulse 3s ease-in-out infinite}.radar-motion{animation:radar 18s linear infinite}.bot-float{animation:float 4s ease-in-out infinite}.packet{animation:flow 5s linear infinite}@keyframes pulse{50%{opacity:.35}}@keyframes radar{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes flow{from{stroke-dashoffset:54}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.pulse,.radar-motion,.bot-float,.packet{animation:none}}</style>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="328" rx="22" fill="url(#surface)" stroke="#29364B"/>
<rect x="2" y="2" width="996" height="326" rx="21" fill="url(#grid)"/>
<path d="M26 1H974" stroke="url(#accent)" stroke-width="3"/>
<circle class="pulse" cx="34" cy="30" r="4" fill="#43E6C5"/>
<text x="48" y="35" fill="#A7B6CE" font-size="12" font-weight="600" letter-spacing="2">PKHARSIMRAN / MISSION CONTROL</text>
<text x="829" y="35" fill="#A7B6CE" font-size="12" font-weight="500" >PROFILE // 01</text>
<text x="38" y="112" fill="#EFF4FC" font-size="58" font-weight="750" letter-spacing="-1.5">HARSIMRAN</text>
<text x="38" y="174" fill="#EFF4FC" font-size="58" font-weight="750" letter-spacing="-1.5">SIDHU</text>
<text x="40" y="218" fill="#43E6C5" font-size="25" font-weight="500" >Turning curiosity into automation.</text>
<rect x="40" y="252" width="114" height="28" rx="14" fill="#43E6C5" fill-opacity=".08" stroke="#43E6C5" stroke-opacity=".3"/><text x="52" y="271" fill="#43E6C5" font-size="12" font-weight="600" >SECURITY</text>
<rect x="164" y="252" width="157" height="28" rx="14" fill="#A995FF" fill-opacity=".08" stroke="#A995FF" stroke-opacity=".3"/><text x="176" y="271" fill="#A995FF" font-size="12" font-weight="600" >THREAT INTEL</text>
<rect x="331" y="252" width="145" height="28" rx="14" fill="#F36BAA" fill-opacity=".08" stroke="#F36BAA" stroke-opacity=".3"/><text x="343" y="271" fill="#F36BAA" font-size="12" font-weight="600" >AUTOMATION</text>
<g transform="translate(801 164)"><circle r="108" fill="#43E6C5" fill-opacity=".025" stroke="#29364B"/><circle r="77" fill="none" stroke="#29364B" stroke-dasharray="3 9"/><circle r="43" fill="none" stroke="#43E6C5" stroke-opacity=".18"/><path d="M-115 0H115M0-115V115" stroke="#29364B"/>
<g class="radar-motion"><path d="M0 0L-58-87A105 105 0 0 1 0-105Z" fill="#43E6C5" fill-opacity=".09"/><path d="M0 0V-105" stroke="#43E6C5" stroke-opacity=".55"/></g>
<path d="M0-32L29-21V4C29 25 0 40 0 40S-29 25-29 4V-21Z" fill="#121A26" stroke="#43E6C5" stroke-width="2"/><path d="M-12 2L-3 11L15-10" fill="none" stroke="#43E6C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="pulse" cx="-72" cy="-44" r="5" fill="#F36BAA"/>
<circle class="pulse" cx="64" cy="49" r="5" fill="#A995FF"/>
<circle class="pulse" cx="20" cy="-81" r="4" fill="#43E6C5"/>
</g>
<text x="40" y="310" fill="#A7B6CE" font-size="11" font-weight="500" letter-spacing="1.8">BUILD  /  INVESTIGATE  /  LEARN  /  REPEAT</text>
<g transform="translate(916 258)" shape-rendering="crispEdges"><g class="bot-float"><path d="M12 0H16V8H12ZM0 8H28V32H0ZM4 32H10V38H4ZM18 32H24V38H18Z" fill="#A995FF"/><path d="M4 13H24V24H4Z" fill="#0D1117"/><path d="M7 16H11V20H7ZM17 16H21V20H17Z" fill="#43E6C5"/><rect x="11" y="27" width="6" height="2" fill="#0D1117"/></g></g></g></svg>
