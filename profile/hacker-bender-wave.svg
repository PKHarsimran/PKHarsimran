<svg xmlns="http://www.w3.org/2000/svg" width="320" height="340" viewBox="-96 -117 192 196" role="img" aria-labelledby="title desc"><title id="title">Hacker Bender</title><desc id="desc">Cute Bender fan art: silver face, sleepy yellow eyes, toothy grin, charcoal hoodie, mint and pink piping, and a friendly three-finger wave. Eyes blink and the antenna softly pings. Reduced motion keeps the character still.</desc><g transform="translate(0 0) scale(1)" data-mascot="hacker-bender" aria-hidden="true"><style>
.bender-idle{animation:bender-idle 7s ease-in-out infinite}
.bender-eyes{transform-box:fill-box;transform-origin:center;animation:bender-blink 8s linear infinite}
.bender-wave{transform-origin:0 0;animation:bender-wave 14s ease-in-out infinite}
.bender-signal{transform-box:fill-box;transform-origin:center;opacity:0;animation:bender-signal 7s ease-out infinite}
.bender-cursor{animation:bender-cursor 3s steps(1,end) infinite}
@keyframes bender-idle{50%{transform:translateY(-2px)}}
@keyframes bender-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
@keyframes bender-wave{0%,62%,88%,100%{transform:rotate(0)}68%,78%{transform:rotate(-9deg)}73%,83%{transform:rotate(5deg)}}
@keyframes bender-signal{0%,67%,100%{opacity:0;transform:scale(.7)}72%{opacity:.55}89%{opacity:0;transform:scale(1.7)}}
@keyframes bender-cursor{0%,62%,100%{opacity:1}63%,99%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.bender-idle,.bender-eyes,.bender-wave,.bender-signal,.bender-cursor{animation:none}.bender-signal{display:none}.bender-cursor{opacity:.7}}
</style><defs><linearGradient id="bender-portrait-metal" x2="1" y2=".3"><stop stop-color="#E5EDF4"/><stop offset=".38" stop-color="#AABAC9"/><stop offset="1" stop-color="#75889E"/></linearGradient><linearGradient id="bender-portrait-hood" x2="1" y2="1"><stop stop-color="#303D50"/><stop offset=".55" stop-color="#1C2738"/><stop offset="1" stop-color="#111B2A"/></linearGradient></defs><ellipse cx="1" cy="68" rx="41" ry="5" fill="#050A12" fill-opacity=".45"/><g class="bender-idle" stroke="#080F19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-23 29H-6L-7 56H-25ZM7 29H24L26 56H8Z" fill="url(#bender-portrait-metal)"/><path d="M-24 39L-7 40M-24 47L-7 48M8 40L25 39M8 48L25 47" fill="none" stroke="#53667E" stroke-width="1.7"/><path d="M-26 53Q-34 54-35 62Q-34 67-9 65Q-5 64-6 57L-9 54ZM10 54L25 53Q35 56 36 63Q34 67 10 65Q6 64 8 57Z" fill="url(#bender-portrait-metal)"/><path d="M-29 61H-12M13 61H30" stroke="#EDF6FF" stroke-opacity=".55" stroke-width="1.2"/><path d="M-27-12Q-44-8-42 12L-31 33Q0 41 32 33L40 10Q44-8 26-12L7-5H-8Z" fill="url(#bender-portrait-hood)"/><path d="M-15-8H15L17 33Q0 37-16 33Z" fill="url(#bender-portrait-metal)"/><rect x="-9" y="7" width="17" height="20" rx="3" fill="#9BAEC0" stroke="#465B72" stroke-width="1.4"/><circle cx="4" cy="17" r="1.5" fill="#DCE8F2" stroke="#465B72" stroke-width="1"/><path d="M-26-10L-9 1L-19 12L-22 32M25-10L9 1L20 13L21 32" fill="none" stroke="#536176" stroke-width="1.6"/><path d="M-34 0L-29 27M31-1L29 28" fill="none" stroke="#43E6C5" stroke-width="1.7"/><path d="M35 7L32 29" fill="none" stroke="#F36BAA" stroke-width="1.6"/><path d="M-17-2L-20 13M18-2L21 14" stroke="#BAC7D7" stroke-width="1.1"/><path d="M-21 12V16M22 13V17" stroke="#D6E0ED" stroke-width="2"/><path d="M-35-1Q-47 9-43 23L-35 27L-28 18" fill="url(#bender-portrait-hood)"/><path d="M-43 21Q-50 24-45 32Q-39 38-34 31L-34 27Z" fill="url(#bender-portrait-metal)"/><g transform="translate(30 3)"><g class="bender-wave"><path d="M-2-11Q12-13 17 